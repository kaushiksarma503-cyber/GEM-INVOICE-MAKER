<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JU ENTERPRISE — Invoice Generator</title>
<style>
:root{--b:#0875C9;--n:#083B66;--o:#F7941D;--l:#f4f8fc;--bd:#d7e3ee;--t:#17324d}
*{box-sizing:border-box}body{margin:0;background:#eef3f8;font:14px Arial;color:var(--t)}
.app{max-width:1400px;margin:auto;padding:22px}.top{background:linear-gradient(135deg,var(--n),var(--b));color:white;border-radius:16px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{display:flex;gap:12px;align-items:center}.brand img{width:58px;height:58px;background:white;border-radius:10px;padding:4px;object-fit:contain}.brand h1{margin:0;font-size:23px}.brand p{margin:4px 0;opacity:.85}
button{border:0;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer}.light{background:#fff;color:var(--n)}.orange{background:var(--o);color:white}
.layout{display:grid;grid-template-columns:400px 1fr;gap:18px}.panel{background:white;border:1px solid var(--bd);border-radius:14px;padding:17px;box-shadow:0 5px 20px #083b6612}
h2{font-size:15px;color:var(--n);margin:0 0 12px}.section{border-top:1px solid var(--bd);padding-top:14px;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-size:11px;font-weight:bold;color:#6b7d8d;margin-bottom:4px}
input,textarea,select{width:100%;padding:9px;border:1px solid #ccd9e4;border-radius:7px;font:inherit;color:var(--t)}textarea{min-height:65px;resize:vertical}.full{grid-column:1/-1}
.item{border:1px solid var(--bd);padding:9px;border-radius:8px;margin-bottom:8px;background:#fbfdff}.itemtop{display:flex;justify-content:space-between;margin-bottom:7px;font-size:12px}
.small{padding:6px 9px;font-size:11px;background:#edf3f8;color:var(--n)}
.invoice{background:#fff;min-height:1120px;padding:34px;border-radius:3px}.head{display:flex;justify-content:space-between;border-bottom:3px solid var(--b);padding-bottom:16px}
.invbrand{display:flex;gap:12px;align-items:center}.invbrand img{width:72px;height:72px;object-fit:contain}.invbrand h2{font-size:25px;margin:0}.invbrand p{font-size:11px;line-height:1.5;color:#6b7d8d;margin:3px 0}
.title{text-align:right}.title h1{color:var(--b);font-size:30px;margin:0}.title p{font-size:12px;color:#6b7d8d;line-height:1.7}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0}.box{background:var(--l);border-left:4px solid var(--o);padding:10px 12px;font-size:11px;line-height:1.55}.box b{color:var(--n)}
table{width:100%;border-collapse:collapse}th{background:var(--n);color:#fff;padding:8px 6px;font-size:10px;text-align:left}td{border-bottom:1px solid var(--bd);padding:8px 6px;font-size:11px}.num{text-align:right}
.tot{width:330px;margin:15px 0 0 auto}.tot td{border:0;padding:5px}.grand td{border-top:2px solid var(--n);font-size:14px;font-weight:bold;color:var(--n);padding-top:9px}
.amount{margin-top:15px;background:var(--l);padding:10px;border-radius:6px;font-size:11px}.notes{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:20px}.notes h4{font-size:11px;color:var(--n);margin:0 0 6px}.notes p{font-size:10px;color:#6b7d8d;white-space:pre-line;line-height:1.5}.sign{text-align:right;padding-top:20px}.line{display:inline-block;width:150px;border-top:1px solid #777;margin-top:30px}.foot{text-align:center;border-top:1px solid var(--bd);padding-top:8px;margin-top:22px;font-size:9px;color:#6b7d8d}
@media(max-width:950px){.layout{grid-template-columns:1fr}}@media print{body{background:white}.app{padding:0}.top,.editor{display:none!important}.layout{display:block}.panel{border:0;box-shadow:none;padding:0}.invoice{padding:12mm;min-height:auto}@page{size:A4;margin:0}}

body.login-view{min-height:100vh;background:linear-gradient(145deg,#eaf1f8,#f7f9fc 55%,#e8eef6);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}#loginGate{width:100%;max-width:410px;margin:0 auto;background:#fff;padding:34px 30px 28px;border-radius:18px;box-shadow:0 14px 44px #183b6020;color:#243447;text-align:center;box-sizing:border-box}#loginLogo{display:block;width:112px;height:112px;object-fit:contain;margin:0 auto 14px}#loginGate h1{margin:0 0 5px;color:#163d68;font-size:27px;letter-spacing:.4px}#loginGate .login-subtitle{margin:0 0 25px;color:#718096;font-size:14px}#loginGate label{display:block;text-align:left;font-size:13px;font-weight:600;color:#40546a;margin:10px 0 5px}#loginGate input{width:100%;padding:13px 14px;margin:0 0 8px;border:1px solid #d5deea;border-radius:9px;box-sizing:border-box;font-size:15px;background:#fbfcfe}#loginGate input:focus{outline:2px solid #b9d5f5;border-color:#477eb7}#loginGate button{margin:12px 0 0;width:100%;padding:12px;border-radius:9px;font-weight:600}#loginGate button+button{margin-top:8px;background:#fff;color:#163d68;border:1px solid #cbd7e5}#loginStatus{font-size:13px;color:#a33;min-height:20px;margin:12px 0 6px;overflow-wrap:anywhere}#loginGate small{display:block;color:#8190a1;line-height:1.5;margin-top:8px}#app{display:none}

function words(n){n=Math.round(n||0);if(!n)return"Zero Rupees Only";let o=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],t=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];function u(x){let s="";if(x>=100){s+=o[Math.floor(x/100)]+" Hundred";x%=100;if(x)s+=" "}if(x>=20){s+=t[Math.floor(x/10)];x%=10;if(x)s+=" "+o[x]}else if(x)s+=o[x];return s}let s="";if(n>=1e7){s+=u(Math.floor(n/1e7))+" Crore ";n%=1e7}if(n>=1e5){s+=u(Math.floor(n/1e5))+" Lakh ";n%=1e5}if(n>=1e3){s+=u(Math.floor(n/1e3))+" Thousand ";n%=1e3}s+=u(n);return s.trim()+" Rupees Only"}
function editor(){ $("items").innerHTML=items.map((x,i)=>`<div class="item"><div class="itemtop"><b>Item ${i+1}</b><button class="small" onclick="removeItem(${i})">Remove</button></div><div class="grid"><div class="full"><label>Description</label><input value="${esc(x.desc)}" oninput="seti(${i},'desc',this.value)"></div><div><label>HSN / SAC</label><input value="${esc(x.hsn)}" oninput="seti(${i},'hsn',this.value)"></div><div><label>Qty</label><input type="number" step=".01" value="${x.qty}" oninput="seti(${i},'qty',this.value)"></div><div><label>Rate ₹</label><input type="number" step=".01" value="${x.rate}" oninput="seti(${i},'rate',this.value)"></div><div><label>GST %</label><input type="number" step=".01" value="${x.gst}" oninput="seti(${i},'gst',this.value)"></div></div></div>`).join("")}
function seti(i,k,v){items[i][k]=(k==="desc"||k==="hsn")?v:Number(v)||0;render()}
function addItem(){items.push({desc:"New Item",hsn:"",qty:1,rate:0,gst:Number($("defgst").value)||0});editor();render()}
function removeItem(i){if(items.length>1){items.splice(i,1);editor();render()}}
function render(){
let sub=0,tax=0,mode=$("mode").value;let rows=items.map((x,i)=>{let a=x.qty*x.rate,tx=mode==="none"?0:a*x.gst/100;sub+=a;tax+=tx;return`<tr><td>${i+1}</td><td><b>${esc(x.desc)}</b></td><td>${esc(x.hsn)||"—"}</td><td class="num">${x.qty}</td><td class="num">₹ ${money(x.rate)}</td><td class="num">${mode==="none"?"—":x.gst+"%"}</td><td class="num">₹ ${money(a)}</td></tr>`}).join("");
let ig=mode==="igst"?tax:0, cg=mode==="cs"?tax/2:0,sg=mode==="cs"?tax/2:0,rawTotal=sub+tax,total=Math.round(rawTotal),roundOff=total-rawTotal;
let date=$("date").value?new Date($("date").value+"T00:00:00").toLocaleDateString("en-IN"):new Date().toLocaleDateString("en-IN");
$("preview").innerHTML=`<div class="head"><div class="invbrand"><img src="${logo}"><div><h2>${seller.name}</h2><p>${seller.address}<br>Mobile: ${seller.mobile}<br>Email: ${seller.email}</p></div></div><div class="title"><h1>TAX INVOICE</h1><p><b>Invoice No:</b> ${esc($("ino").value)}<br><b>Date:</b> ${date}</p></div></div>
<div class="meta"><div class="box"><b>BILL TO</b><br><strong>${esc($("buyer").value)||"Buyer / Department Name"}</strong><br>${esc($("addr").value)||"Billing address"}<br>GSTIN: ${esc($("gstin").value)||"—"}<br>Contact: ${esc($("contact").value)||"—"}</div><div class="box"><b>ORDER / SUPPLY DETAILS</b><br>PO / GeM Ref: ${esc($("po").value)||"—"}<br>Delivery: ${esc($("delivery").value)||"—"}<br>Place of Supply: ${esc($("place").value)||"Assam"}<br>Reverse Charge: ${esc($("rc").value)}</div></div>
<table><thead><tr><th>#</th><th>Description</th><th>HSN/SAC</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">GST</th><th class="num">Amount</th></tr></thead><tbody>${rows}</tbody></table>
<table class="tot"><tr><td>Taxable Amount</td><td class="num">₹ ${money(sub)}</td></tr>${mode==="igst"?`<tr><td>IGST</td><td class="num">₹ ${money(ig)}</td></tr>`:""}${mode==="cs"?`<tr><td>CGST</td><td class="num">₹ ${money(cg)}</td></tr><tr><td>SGST</td><td class="num">₹ ${money(sg)}</td></tr>`:""}<tr><td>Round Off</td><td class="num">₹ ${money(roundOff)}</td></tr><tr class="grand"><td>Grand Total</td><td class="num">₹ ${money(total)}</td></tr></table>
<div class="amount"><b>Amount in Words:</b> ${words(total)}</div><div class="notes"><div><h4>TERMS & NOTES</h4><p>${esc($("notes").value)}</p></div><div class="sign"><h4>For JU ENTERPRISE</h4><span class="line"></span><p>Authorized Signatory</p></div></div><div class="foot">Thank you for your business. | JU ENTERPRISE | ${seller.web}</div>`;
}
function newInv(){["buyer","addr","gstin","po","delivery","contact"].forEach(x=>$(x).value="");$("ino").value="JU/INV/2026/001";items=[{desc:"Product / Service Description",hsn:"",qty:1,rate:0,gst:18}];window.items=items;editor();render()}
document.querySelectorAll("input,textarea,select").forEach(e=>e.addEventListener("input",render));

function printInvoice(){const n=(document.getElementById("ino").value||"invoice").replace(/[^a-z0-9_-]+/gi,"_");document.title="JU_ENTERPRISE_"+n;window.print();}
</script>

import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, push, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCquIN9nkc-SDHBfaIOt8h5HqAEfQG21FY",authDomain:"gem-invoice-1e9eb.firebaseapp.com",databaseURL:"https://gem-invoice-1e9eb-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"gem-invoice-1e9eb",storageBucket:"gem-invoice-1e9eb.firebasestorage.app",messagingSenderId:"279316588289",appId:"1:279316588289:web:930d7efa2ae43e8c795d00",measurementId:"G-X2KK373YNX"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app,firebaseConfig.databaseURL);let activeUser=null,historyRows=[];
const el=id=>document.getElementById(id),status=t=>{if(el("fbStatus"))el("fbStatus").textContent=t;};
const fields=["ino","date","place","rc","buyer","addr","gstin","po","delivery","contact","mode","defgst","notes"];
function snapshot(){return {invoiceNo:el("ino").value,date:el("date").value,fields:Object.fromEntries(fields.map(id=>[id,el(id)?.value??""])),items:window.items||[],updatedAt:new Date().toISOString()};}
function updateHistory(rows){historyRows=rows;const sel=el("fbHistory");sel.innerHTML='<option value="">Choose saved invoice…</option>';rows.forEach(d=>{let o=document.createElement("option");o.value=d.id;o.textContent=(d.invoiceNo||"Invoice")+" — "+(d.date||"");sel.appendChild(o);});}
async function refreshHistory(){if(!activeUser)return;const snap=await get(ref(db,`users/${activeUser.uid}/invoices`));const val=snap.exists()?snap.val():{};const rows=Object.entries(val).map(([id,data])=>({id,...data})).sort((a,b)=>String(b.updatedAt||"").localeCompare(String(a.updatedAt||"")));updateHistory(rows);}
function showInvoiceApp(user){activeUser=user;const gate=el("loginGate"),main=el("app");if(gate)gate.style.display=user?"none":"block";if(main){main.style.display=user?"block":"none";main.removeAttribute("hidden");}document.body.classList.toggle("login-view",!user);if(user){el("loginStatus").textContent="";if(el("fbPassword"))el("fbPassword").value="";status("Signed in: "+(user.email||"account"));}else{updateHistory([]);if(el("loginStatus"))el("loginStatus").textContent="Please sign in to continue.";}}
window.fbSignIn=async()=>{const msg=el("loginStatus");try{msg.textContent="Signing in…";const email=el("fbEmail").value.trim(),password=el("fbPassword").value;if(!email||!password)throw new Error("Enter your email and password.");const credential=await Promise.race([signInWithEmailAndPassword(auth,email,password),new Promise((_,reject)=>setTimeout(()=>reject(new Error("Sign-in is taking too long. Check your internet connection and Firebase Authentication settings. If testing locally, host this file on an authorized domain.")),15000))]);showInvoiceApp(credential.user);try{await refreshHistory();}catch(e){status("Signed in, but history could not load: "+e.message);}}catch(e){msg.textContent="Sign-in failed: "+(e?.code?e.code+" — ":"")+e.message;}};
window.fbSignUp=async()=>{try{el("loginStatus").textContent="Creating account…";await createUserWithEmailAndPassword(auth,el("fbEmail").value,el("fbPassword").value);el("loginStatus").textContent="Account created.";}catch(e){el("loginStatus").textContent="Account creation failed: "+e.message;}};
window.fbSignOut=async()=>{try{await signOut(auth);}catch(e){status(e.message);}};window.fbRefreshHistory=()=>refreshHistory().catch(e=>status("History unavailable: "+e.message));
window.fbSaveInvoice=async()=>{if(!activeUser){status("Please sign in first.");return;}try{const data=snapshot();data.items=window.items||[];const invoiceRef=push(ref(db,`users/${activeUser.uid}/invoices`));await set(invoiceRef,data);await refreshHistory();status("Invoice saved to cloud.");}catch(e){status("Save failed: "+e.message);}};
window.fbLoadInvoice=async id=>{if(!id||!activeUser)return;try{const snap=await get(ref(db,`users/${activeUser.uid}/invoices/${id}`));if(!snap.exists())throw Error("Invoice not found");const d=snap.val();for(const [k,v] of Object.entries(d.fields||{})){if(el(k))el(k).value=v;}window.items=d.items||[{desc:"Product / Service Description",hsn:"",qty:1,rate:0,gst:18}];items=window.items;editor();render();status("Invoice loaded.");}catch(e){status("Load failed: "+e.message);}};
onAuthStateChanged(auth,async user=>{showInvoiceApp(user);if(user){try{await refreshHistory();}catch(e){status("History unavailable: "+e.message);}}});
function xmlEscape(v){return String(v??"").replace(/[<>&"']/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&apos;"}[c]));}
function historyData(){const id=el("fbHistory").value;return historyRows.find(x=>x.id===id);}
function dl(content,mime,ext,d){if(!d){status("Select an invoice from history first.");return;}let no=String(d.invoiceNo||"invoice").replace(/[^a-z0-9_-]+/gi,"_");const blob=new Blob([content],{type:mime});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="JU_ENTERPRISE_"+no+"."+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}
function exportHistory(fmt){const d=historyData();if(!d){status("Select an invoice from history first.");return;}const f=d.fields||{},items=d.items||[];const esc=xmlEscape;const company="JU ENTERPRISE | Noonmati, Guwahati, Assam – 781020 | +91 70022 17037 | juenterprise.in@gmail.com";const rows=items.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.desc)}</td><td>${esc(x.hsn)}</td><td>${esc(x.qty)}</td><td>${esc(x.rate)}</td><td>${esc(x.gst)}%</td><td>${(Number(x.qty)||0)*(Number(x.rate)||0)}</td></tr>`).join("");const html=`<html><head><meta charset="utf-8"><style>body{font-family:Arial;padding:28px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #888;padding:7px;text-align:left}</style></head><body><h1>JU ENTERPRISE</h1><p>${company}</p><h2>TAX INVOICE</h2><p>Invoice No: ${esc(d.invoiceNo||f.ino)}<br>Date: ${esc(d.date||f.date)}<br>Buyer: ${esc(f.buyer)}<br>Billing Address: ${esc(f.addr)}<br>GSTIN: ${esc(f.gstin)}<br>PO / GeM Ref: ${esc(f.po)}<br>Delivery: ${esc(f.delivery)}<br>Place of Supply: ${esc(f.place)}</p><table><thead><tr><th>#</th><th>Description</th><th>HSN/SAC</th><th>Qty</th><th>Rate</th><th>GST</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table><p>Notes: ${esc(f.notes)}</p><p>For JU ENTERPRISE — Authorized Signatory</p></body></html>`;
if(fmt==="word"){dl(html,"application/msword","doc",d);return;}if(fmt==="xls"){dl(html,"application/vnd.ms-excel","xls",d);return;}if(fmt==="pdf"){const w=window.open("","_blank");if(!w){status("Allow pop-ups to print PDF.");return;}w.document.write(html);w.document.close();w.document.title="JU_ENTERPRISE_"+String(d.invoiceNo||"invoice").replace(/[^a-z0-9_-]+/gi,"_");w.focus();w.print();return;}const xml=`<?xml version="1.0" encoding="UTF-8"?><Invoice><Company>${esc(company)}</Company><InvoiceNo>${esc(d.invoiceNo||f.ino)}</InvoiceNo><Date>${esc(d.date||f.date)}</Date><Buyer>${esc(f.buyer)}</Buyer><Address>${esc(f.addr)}</Address><GSTIN>${esc(f.gstin)}</GSTIN><PO>${esc(f.po)}</PO><Items>${items.map(x=>`<Item><Description>${esc(x.desc)}</Description><HSN>${esc(x.hsn)}</HSN><Quantity>${esc(x.qty)}</Quantity><Rate>${esc(x.rate)}</Rate><GST>${esc(x.gst)}</GST></Item>`).join("")}</Items></Invoice>`;dl(xml,"application/xml","xml",d);}
window.exportHistory=exportHistory;
</script></body></html>
